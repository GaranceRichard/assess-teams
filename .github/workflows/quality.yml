name: Quality gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.impact.outputs.full }}
      repository: ${{ steps.impact.outputs.repository }}
      backend: ${{ steps.impact.outputs.backend }}
      frontend: ${{ steps.impact.outputs.frontend }}
      e2e: ${{ steps.impact.outputs.e2e }}
      plan: ${{ steps.impact.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: impact
        env:
          QUALITY_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/quality/selective.mjs --base "$QUALITY_DIFF_BASE" --head "$GITHUB_SHA" --plan
      - uses: actions/upload-artifact@v4
        with:
          name: impact-plan
          path: .cache/quality/plan.json
          include-hidden-files: true
          if-no-files-found: error
  full:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/exhaustive.yml
    with:
      candidate: ${{ github.sha }}
  repository:
    needs: plan
    if: needs.plan.outputs.full == 'false'
    runs-on: ubuntu-latest
    env:
      QUALITY_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      REQUIRED_SCOPE: ${{ needs.plan.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: needs.plan.outputs.repository == 'repository'
        with:
          python-version: '3.13'
      - run: node scripts/quality/selective.mjs --base "$QUALITY_DIFF_BASE" --head "$GITHUB_SHA" --only "$REQUIRED_SCOPE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-metrics
          path: .cache/quality/metrics.jsonl
          include-hidden-files: true
          if-no-files-found: error
  backend:
    needs: plan
    if: needs.plan.outputs.full == 'false' && needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      QUALITY_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - shell: pwsh
        run: ./scripts/bootstrap/backend.ps1
      - run: node scripts/quality/selective.mjs --base "$QUALITY_DIFF_BASE" --head "$GITHUB_SHA" --only backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-metrics
          path: .cache/quality/metrics.jsonl
          include-hidden-files: true
          if-no-files-found: error
  frontend:
    needs: plan
    if: needs.plan.outputs.full == 'false' && needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      QUALITY_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: node scripts/quality/selective.mjs --base "$QUALITY_DIFF_BASE" --head "$GITHUB_SHA" --only frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-metrics
          path: .cache/quality/metrics.jsonl
          include-hidden-files: true
          if-no-files-found: error
  e2e:
    needs: plan
    if: needs.plan.outputs.full == 'false' && needs.plan.outputs.e2e == 'true'
    uses: ./.github/workflows/selective-e2e.yml
  quality:
    name: Required impact gate
    needs: [plan, full, repository, backend, frontend, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          QUALITY_PLAN: ${{ needs.plan.outputs.plan }}
          QUALITY_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/quality/selective-ci.mjs
