name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Full quality gate
    runs-on: ubuntu-latest
    env:
      QUALITY_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout complet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer Python
        if: ${{ hashFiles('backend/pyproject.toml', 'backend/requirements*.txt') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer le backend
        if: ${{ hashFiles('backend/pyproject.toml', 'backend/requirements*.txt') != '' }}
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path backend/requirements-dev.txt) {
            python -m pip install -r backend/requirements-dev.txt
          } elseif (Test-Path backend/pyproject.toml) {
            python -m pip install -e './backend[dev]'
          } else {
            python -m pip install -r backend/requirements.txt
          }

      - name: Préparer Node.js
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer le frontend
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: npm ci --prefix frontend

      - name: Installer les navigateurs Playwright
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Exécuter le full quality gate commun
        shell: pwsh
        run: ./scripts/quality.ps1 full
