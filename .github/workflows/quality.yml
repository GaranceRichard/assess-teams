name: Quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository constraints
    runs-on: ubuntu-latest
    env:
      QUALITY_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Contraintes, secrets, documentation et tests des scripts
        run: npm run quality:full -- -Scope repository

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Préparer le runtime backend local
        shell: pwsh
        run: ./scripts/bootstrap/backend.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint, format, migrations, tests et coverage backend
        run: npm run quality:full -- -Scope backend

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Lint, format, typecheck, build, tests et coverage frontend
        run: npm run quality:full -- -Scope frontend

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Préparer le runtime backend local
        shell: pwsh
        run: ./scripts/bootstrap/backend.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Installer uniquement Chromium headless et ses dépendances système
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium
      - name: Parcours Playwright avec backend et Vite réels
        run: npm run quality:full -- -Scope e2e
      - name: Conserver les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Full quality gate
    runs-on: ubuntu-latest
    needs: [repository, backend, frontend, e2e]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exiger le succès de chaque gate sans réexécuter les contrôles
        env:
          QUALITY_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/quality/complete-ci.mjs
