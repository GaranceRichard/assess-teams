name: Backend validation
on:
  workflow_call:
    inputs:
      candidate:
        required: true
        type: string
      complete:
        default: true
        type: boolean
      base:
        default: ''
        type: string
permissions:
  contents: read
jobs:
  backend-static:
    name: Backend static quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: PrÃ©parer le runtime backend local
        shell: pwsh
        run: ./scripts/bootstrap/backend.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ruff lint, format et migrations
        if: inputs.complete
        run: npm run quality:full -- -Scope backend-static

      - name: Validation backend ciblee selon le diff
        if: ${{ !inputs.complete }}
        env:
          QUALITY_DIFF_BASE: ${{ inputs.base }}
        run: node scripts/quality/selective.mjs --base "$QUALITY_DIFF_BASE" --head "$GITHUB_SHA" --only backend
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.complete }}
        with:
          name: backend-metrics
          path: .cache/quality/metrics.jsonl
          include-hidden-files: true
          if-no-files-found: error

  backend-tests:
    if: inputs.complete
    name: Backend tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: PrÃ©parer le runtime backend local
        shell: pwsh
        run: ./scripts/bootstrap/backend.ps1
      - name: Tests et donnÃ©es de couverture du shard
        run: backend/.venv/bin/python scripts/quality/backend_shards.py ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: backend/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  backend-coverage:
    if: inputs.complete
    name: Backend global coverage
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-coverage-*
          path: backend/coverage/
          merge-multiple: true
      - name: Installer seulement la version de coverage utilisÃ©e par les shards
        run: python -m pip install -r backend/coverage/coverage-version-1.txt
      - name: Fusion complÃ¨te et seuil global >= 90 %
        working-directory: backend
        run: python ../scripts/quality/combine_backend_coverage.py coverage
      - uses: actions/upload-artifact@v4
        with:
          name: backend-global-coverage
          path: backend/coverage/backend.xml
          if-no-files-found: error
          retention-days: 7
