name: Exhaustive qualification
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      candidate:
        description: SHA complet du candidat (vide = main au declenchement)
        required: false
        type: string
  workflow_call:
    inputs:
      candidate:
        required: false
        type: string
      base:
        required: false
        type: string
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.diff.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identifier le commit immuable
        env:
          CANDIDATE: ${{ inputs.candidate || github.sha }}
        run: node scripts/quality/qualification.mjs identify "$CANDIDATE"
      - name: Etablir la base documentaire du candidat exact
        id: diff
        env:
          CANDIDATE: ${{ inputs.candidate || github.sha }}
          QUALITY_DIFF_BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const commit = (ref) => {
            if (!ref || ref.startsWith('-')) throw new Error('Reference Git invalide');
            return git('rev-parse', '--verify', `${ref}^{commit}`);
          };
          const candidate = commit(process.env.CANDIDATE);
          const event = process.env.GITHUB_EVENT_NAME;
          const explicit = process.env.QUALITY_DIFF_BASE;
          let reference;
          if (['push', 'pull_request', 'workflow_call'].includes(event) && explicit) {
            reference = explicit;
          } else if (['workflow_dispatch', 'schedule', 'workflow_call'].includes(event)) {
            reference = `${candidate}^1`;
          } else {
            throw new Error('Base Git explicite requise pour cet evenement');
          }
          let base;
          try {
            base = commit(reference);
            git('merge-base', '--is-ancestor', base, candidate);
          } catch {
            throw new Error('Base Git ou parent du candidat inutilisable ; controle refuse');
          }
          if (base === candidate) throw new Error('Base Git identique au candidat ; controle vide refuse');
          if (!process.env.GITHUB_OUTPUT) throw new Error('Sortie GitHub absente');
          appendFileSync(process.env.GITHUB_OUTPUT, `base=${base}\n`);
          console.log(`Base documentaire du candidat : ${base}`);
          JS
  repository:
    needs: identity
    name: Repository constraints
    runs-on: ubuntu-latest
    env:
      QUALITY_DIFF_BASE: ${{ needs.identity.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Contraintes, secrets, documentation et tests des scripts
        run: npm run quality:full -- -Scope repository

  backend:
    needs: identity
    uses: ./.github/workflows/backend.yml
    with:
      candidate: ${{ inputs.candidate || github.sha }}

  frontend:
    needs: identity
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Lint, format, typecheck, build, tests et coverage frontend
        run: npm run quality:full -- -Scope frontend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-and-metrics
          path: |
            frontend/coverage/
            .cache/quality/metrics.jsonl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: identity
    with:
      candidate: ${{ inputs.candidate || github.sha }}
    uses: ./.github/workflows/e2e.yml

  quality:
    needs: [repository, backend, frontend, e2e]
    if: ${{ always() }}
    uses: ./.github/workflows/exhaustive-report.yml
    with:
      candidate: ${{ inputs.candidate || github.sha }}
      results: ${{ toJSON(needs) }}
